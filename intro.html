<!DOCTYPE html>
<html>
  <head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サイト説明</title>
  <style>
body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
    url("bg-lock.jpg") center / cover no-repeat;
}

.btn2 {
      padding: 12px 32px;
      font-size: 18px;
      color: white;
      background-color: #ff6f61;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 
        background-color 0.3s,
        transform 0.2s,
        box-shadow 0.2s;
    display: flex;
    justify-content: flex-end;
    

margin: 40px auto;
    }

    .btn2:hover {
      background-color: #ff3b2f;
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }
    </style>
    <body>
        <h1>このサイトは何？</h1>
        <h2>このサイトは<font color="red">「とよシローなにシロークイズ」</font>をまとめるのと同時に
            プログラミング言語である<font color="blue">「html」「css」「javascript」</font>を練習する
            ことを目的にして作られたよ！
        </h2>
        <img src="rou.jpg" width="100%" height="100%">
        <button onclick="modoru()" class="btn2">戻る</button>
          <script src="script.js"></script>
        </body>
